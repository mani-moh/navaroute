name: CI Tests & Security Gate

on:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "sources.json"
      - "sources.private.json.example"
      - ".github/workflows/**"
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile Python modules
        run: python -m compileall -q src scripts tests

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Static privacy & secret scan
        shell: bash
        run: |
          if git status --porcelain | grep -E "(sources\.private\.json|private_subs/|\.env$)"; then
            echo "ERROR: Private files detected in tracked state!"
            exit 1
          fi
          if git grep -I -E "(nvapi-[A-Za-z0-9_-]{10,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})"; then
            echo "CRITICAL: Potential secret credential pattern found in tracked files!"
            exit 1
          fi
          echo "Static security scan passed: 0 secret patterns found."
