name: NavaRoute Tests & Security Gate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified action-pins.md
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified action-pins.md
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tracked privacy gate
        run: python scripts/public_git.py check
      - name: Byte-compile Python modules
        run: python -m compileall -q src scripts tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
