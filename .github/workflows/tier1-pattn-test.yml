# Tier 1 PattN testing: Realping-test due configs every 2 hours.
#
# Runs the headless PattN WebAPI (pinned P40 release) on a Windows
# runner and Realping-tests the configs due under the failure backoff.
# Commits data/tier1_state.json, data/tier1_results.json and the
# subs/tier1_<group>.txt (+ _base64) variants. See TIERED-TESTING.md.
name: Tier 1 PattN Test

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      max_configs:
        description: "Maximum configs to test this run"
        required: false
        default: "8000"
      speedtest_timeout:
        description: "Seconds to wait for the speed test to finish"
        required: false
        default: "5400"

permissions:
  contents: write

concurrency:
  group: navaroute-git-writer
  cancel-in-progress: false

jobs:
  tier1:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified action-pins.md
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified action-pins.md
        with:
          python-version: "3.12"

      - name: Download the pinned PattN WebAPI (P40)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/patterniha/PattN/releases/download/7.25.6-P40/v2rayN.WebAPI-windows-64.zip'
          Invoke-WebRequest -Uri $url -OutFile webapi.zip
          Expand-Archive webapi.zip -DestinationPath webapi
          Get-ChildItem -Recurse webapi -Filter 'v2rayN.WebAPI.exe' | Select-Object -First 1 FullName

      - name: Run tier 1
        shell: pwsh
        run: |
          python scripts/tier1_pattn.py --webapi-dir webapi `
            --per-run-cap ${{ inputs.max_configs || 8000 }} `
            --speedtest-timeout ${{ inputs.speedtest_timeout || 5400 }}

      - name: Privacy gate (pre-flight)
        shell: pwsh
        run: python scripts/public_git.py check

      - name: Commit tier-1 outputs
        shell: pwsh
        run: |
          git config user.name 'navaroute-bot'
          git config user.email 'navaroute-bot@users.noreply.github.com'
          git add -- data/tier1_state.json data/tier1_results.json subs/tier1_all.txt subs/tier1_all_base64.txt subs/tier1_reachable.txt subs/tier1_reachable_base64.txt subs/tier1_active.txt subs/tier1_active_base64.txt subs/tier1_top100.txt subs/tier1_top100_base64.txt subs/tier1_lite500.txt subs/tier1_lite500_base64.txt
          git diff --cached --quiet && echo 'No tier-1 changes to commit' && exit 0
          python scripts/public_git.py check --staged
          git commit -m 'Tier 1 PattN results'
          python scripts/public_git.py push
