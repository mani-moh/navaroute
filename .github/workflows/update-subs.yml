name: Update PattN Subscriptions

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      run_healthcheck:
        description: "Run live healthcheck on candidate nodes"
        type: boolean
        default: true
      generate_pattn_variants:
        description: "Generate PattN F&F, IPv6-OOB, and SNI-Spoof variants"
        type: boolean
        default: true
      max_test_nodes:
        description: "Maximum number of nodes to health-check"
        type: string
        default: "1000"
      run_discovery:
        description: "Run Autonomous Discovery Agent (NVIDIA Nemotron 3.5 Super VL) before aggregation"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pattn-git-writer
  cancel-in-progress: false

jobs:
  aggregate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Xray Core (patterniha/Xray-core)
        shell: bash
        run: |
          mkdir -p xray-bin
          python -c '
          import urllib.request, json, zipfile, io, os
          try:
              req = urllib.request.Request(
                  "https://api.github.com/repos/patterniha/Xray-core/releases/latest",
                  headers={"User-Agent": "PattN-CI-Fetcher"}
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  rel_data = json.loads(r.read())
              asset = next(
                  (a for a in rel_data.get("assets", []) if "linux-64" in a["name"].lower() and a["name"].endswith(".zip")),
                  None
              )
              if asset:
                  download_url = asset["browser_download_url"]
                  with urllib.request.urlopen(download_url, timeout=30) as z_resp:
                      with zipfile.ZipFile(io.BytesIO(z_resp.read())) as zf:
                          zf.extract("xray", "xray-bin")
                  os.chmod("xray-bin/xray", 0o755)
                  print("patterniha/Xray-core binary downloaded and extracted successfully")
              else:
                  print("No matching Linux x64 asset found, using pure Python healthcheck fallback")
          except Exception as exc:
              print(f"Xray binary download skipped ({exc}), proceeding with socket healthcheck")
          '
          if [ -f "xray-bin/xray" ]; then
            echo "$PWD/xray-bin" >> "$GITHUB_PATH"
          fi

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run Autonomous Discovery Agent (Nemotron 3.5 Super VL)
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_discovery == true) }}
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$NVIDIA_API_KEY" ]; then
            echo "::add-mask::$NVIDIA_API_KEY"
          else
            echo "Note: NVIDIA_API_KEY secret is not set; discovery will run in heuristic fallback mode."
          fi
          python -m src.main --discover-only --discovery-time 360 --discovery-channels 150 || echo "Discovery finished with non-fatal warnings"

      - name: Run public aggregation pipeline
        shell: bash
        run: |
          HC_FLAG="--healthcheck"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_healthcheck }}" = "false" ]; then
            HC_FLAG="--no-healthcheck"
          fi

          PV_FLAG="--pattn-variants"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.generate_pattn_variants }}" = "false" ]; then
            PV_FLAG="--no-pattn-variants"
          fi

          MAX_NODES="1000"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.max_test_nodes }}" ]; then
            MAX_NODES="${{ inputs.max_test_nodes }}"
          fi

          python -m src.main $HC_FLAG $PV_FLAG --max-test-nodes "$MAX_NODES"

      - name: Security audit
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          # 1. Ensure local/secret artifacts are never tracked or staged
          if git status --porcelain | grep -E "(\.env$|local_subs/)"; then
            echo "ERROR: Local/sensitive files detected in git working tree!"
            exit 1
          fi

          # 2. Ensure API keys never leak into public tracked files
          python -c '
          import os, sys, subprocess
          nvapi = os.environ.get("NVIDIA_API_KEY", "").strip()
          if nvapi and len(nvapi) > 8:
              res = subprocess.run(["git", "grep", "-I", "-F", nvapi], capture_output=True, text=True)
              if res.returncode == 0 and res.stdout.strip():
                  print("CRITICAL SECURITY VIOLATION: NVIDIA_API_KEY detected in tracked files!")
                  sys.exit(1)
          print("Security audit passed: 0 leaks found.")
          '

      - name: Commit and push public updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subs/ README.md STATUS.md
          [ -f sources.discovered.json ] && git add sources.discovered.json || true
          [ -f DISCOVERY.md ] && git add DISCOVERY.md || true
          [ -d data ] && git add data/ || true
          if git diff --staged --quiet; then
            echo "No subscription updates to commit"
          else
            git commit -m "chore(auto): update subscriptions & health status [skip ci]"
            CURRENT_BRANCH="${GITHUB_REF_NAME:-$(git branch --show-current)}"
            CURRENT_BRANCH="${CURRENT_BRANCH:-master}"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "$CURRENT_BRANCH" || true
              git push origin "HEAD:$CURRENT_BRANCH" && break || sleep 3
            done
          fi
