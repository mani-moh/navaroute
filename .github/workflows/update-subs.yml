name: Update NavaRoute Subscriptions

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      run_healthcheck:
        description: "Run bounded socket reachability checks (not credential verification)"
        type: boolean
        default: true
      max_test_nodes:
        description: "Maximum candidate nodes to socket-check"
        type: string
        default: "1000"

permissions:
  contents: read

concurrency:
  group: navaroute-git-writer
  cancel-in-progress: false

jobs:
  aggregate-and-publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified action-pins.md
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified action-pins.md
        with:
          python-version: "3.12"
      - name: Tracked privacy gate
        run: python scripts/public_git.py check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run public aggregation pipeline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEALTHCHECK: ${{ inputs.run_healthcheck }}
          MAX_TEST_NODES: ${{ inputs.max_test_nodes }}
        run: |
          set -euo pipefail
          HC_FLAG="--healthcheck"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$RUN_HEALTHCHECK" = "false" ]; then
            HC_FLAG="--no-healthcheck"
          fi
          python -m src.main "$HC_FLAG" --max-test-nodes "${MAX_TEST_NODES:-1000}"
      - name: Stage, audit and publish only public roles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- subs/ README.md STATUS.md sources.discovered.json DISCOVERY.md data/discovery_state.json
          if [ -f data/discovered_ocr_configs.txt ]; then
            git add -- data/discovered_ocr_configs.txt
          fi
          python scripts/public_git.py check --staged
          if git diff --staged --quiet; then
            echo "No public updates to commit"
          else
            git commit -m "chore(auto): refresh NavaRoute public subscriptions"
            python scripts/public_git.py push
          fi
