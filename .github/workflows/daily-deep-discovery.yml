name: NavaRoute Daily Extended Discovery

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      max_api_requests:
        description: "Maximum actual NVIDIA API requests (includes retries and fallbacks)"
        type: string
        default: "500"
      max_time_seconds:
        description: "Discovery network time budget in seconds"
        type: string
        default: "5400"
      max_channels:
        description: "Maximum Telegram channels to crawl"
        type: string
        default: "2000"

permissions:
  contents: read

concurrency:
  group: navaroute-git-writer
  cancel-in-progress: false

jobs:
  daily-deep-discovery:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified action-pins.md
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified action-pins.md
        with:
          python-version: "3.12"
      - name: Tracked privacy gate
        run: python scripts/public_git.py check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run requested discovery
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MAX_REQS: ${{ inputs.max_api_requests }}
          MAX_TIME: ${{ inputs.max_time_seconds }}
          MAX_CHANS: ${{ inputs.max_channels }}
        run: |
          set -euo pipefail
          python -m src.main --discover-only --discovery-api-requests "${MAX_REQS:-500}" --discovery-time "${MAX_TIME:-5400}" --discovery-channels "${MAX_CHANS:-2000}"
      - name: Aggregate newly discovered public sources
        run: python -m src.main --healthcheck --max-test-nodes 1000
      - name: Stage, audit and publish only public roles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- subs/ README.md STATUS.md sources.discovered.json DISCOVERY.md data/discovery_state.json
          if [ -f data/discovered_ocr_configs.txt ]; then
            git add -- data/discovered_ocr_configs.txt
          fi
          python scripts/public_git.py check --staged
          if git diff --staged --quiet; then
            echo "No public updates to commit"
          else
            git commit -m "chore(auto): refresh NavaRoute discovery and subscriptions"
            python scripts/public_git.py push
          fi
