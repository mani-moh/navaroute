name: Public Site

on:
  push:
    branches: [master]
    paths:
      - "subs/**"
      - "sources.json"
      - "data/tier1_results.json"
      - "STATUS.md"
      - "README.md"
      - "scripts/build_public_site.py"
      - "docs/explorer/**"
      - ".github/workflows/public-site.yml"
  schedule:
    # Rebuild every 6h so the page stays fresh even when a run's push
    # touches none of the watched paths.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build the public site
        run: python3 scripts/build_public_site.py --repo-root . --out site

      - name: Keep the Pipeline Explorer alongside it
        run: cp -r docs/explorer site/explorer

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
