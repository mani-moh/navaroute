name: NavaRoute Nightly Full Snapshot Check

# Runs the full 64k-node snapshot tests that are sampled out of the
# default CI run (NAVAROUTE_FULL_SNAPSHOT=1). Nightly only, so the
# ~70s rebrand check and ~8s snapshot load do not slow every push/PR.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified action-pins.md
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified action-pins.md
        with:
          python-version: "3.12"
      - name: Full snapshot tests
        env:
          NAVAROUTE_FULL_SNAPSHOT: "1"
        run: python -m unittest tests.test_rebrand tests.test_final_fixes -v
